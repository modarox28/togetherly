# Verifica cada push y cada PR: tipos, compilación de producción y pruebas de punta a punta.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, compilación y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Falla si aparece una vulnerabilidad crítica en las dependencias que llegan a producción.
      # (Las "altas" que quedan son del CLI de Prisma, que solo corre al compilar; ver SECURITY.md.)
      - name: Revisar dependencias
        run: npm audit --omit=dev --audit-level=critical

      - name: Compilación de producción (sin secretos, como un despliegue nuevo)
        run: npx next build

      - name: Preparar navegador y ffmpeg para las pruebas
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Pruebas de la extensión, el servidor y los planes
        run: npm run test:extension

  secretos:
    name: Buscar claves filtradas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
